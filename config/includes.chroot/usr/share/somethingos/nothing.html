<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #07080b; color: #e8eaed; font: 16px/1.5 Inter, "IBM Plex Sans", sans-serif; }

<body>
  <main>
    <div class="stamp">SomethingOS · telemetry</div>
    <h1>We send your data to <code>nothing.weforgot</code>.</h1>
    <p>
      That hostname is pinned to <code>0.0.0.0</code> in <code>/etc/hosts</code>.
      Firefox’s telemetry server pref is locked to
      <code>https://nothing.weforgot/v1/sink</code>.
      uBlock Origin is force-installed. Popularity-contest is not.
    </p>
    <p>Nothing leaves. We forgot on purpose.</p>
  </main>
