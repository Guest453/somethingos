[Global]
version=1.0
id=somethingos@firefox

[Branding]
brandShortName=SomethingOS Browser
brandFullName=SomethingOS Browser
vendor=SomethingOS
homepageURL=https://nothing.weforgot
extraTitleBar=
releaseNotesURL=
appLicenseURL=

[Preferences]
browser.search.defaultenginename=DuckDuckGo
browser.search.geoSpecificDefaults=false
browser.search.countryCode=US
browser.startup.homepage=file:///usr/share/somethingos/nothing.html
browser.startup.homepage_reset=file:///usr/share/somethingos/nothing.html
browser.startup.page=1
browser.urlbar.suggest.bookmark=false
browser.urlbar.suggest.history=false
browser.urlbar.suggest.openpage=false
browser.urlbar.quicksuggest.enabled=false
privacy.donottrackheader.enabled=true
privacy.trackingprotection.enabled=true
privacy.globalprivacycontrol.enabled=true
privacy.resistFingerprinting=true
browser.cache.disk.enable=false
network.prefetch-next=false
network.dns.disablePrefetch=true
