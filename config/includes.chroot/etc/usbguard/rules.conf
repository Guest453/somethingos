# SomethingOS USBGuard baseline policy.
#
# usbguard ships with ImplicitPolicyTarget=block and NO rules.conf at all,
# and its service is enabled on install. That combination blocks EVERY USB
# device the moment the daemon starts, keyboards and mice included: the
# live GNOME session came up with a completely dead pointer, while a PS/2
# keyboard kept working. That is the bug this file exists to prevent.
#
# A default-block baseline is also actively unsafe for a live image. With
# PresentDevicePolicy=apply-policy, booting SomethingOS from a USB stick
# would deauthorize the boot medium out from under the running system.
#
# So the baseline allows devices, and the real control is GNOME's
# org.gnome.desktop.privacy usb-protection=true (set in our dconf db),
# which tells usbguard to block NEWLY inserted devices while the screen is
# locked. That is the protection users actually want on a desktop.
#
# On an installed machine you can tighten this to the hardware you own:
#     sudo usbguard generate-policy > /etc/usbguard/rules.conf
#     sudo systemctl restart usbguard
#
# A rule with only a target matches any device (usbguard-rules.conf(5)).
allow
