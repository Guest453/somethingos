# SomethingOS neofetch — short, cyan, no clutter.
print_info() {
    info title
    info underline

    info "os" distro
    info "host" model
    info "kern" kernel
    info "up" uptime
    info "pkgs" packages
    info "sh" shell
    info "de" de
    info "wm" wm
    info "term" term
    info "cpu" cpu
    info "mem" memory

    info cols
}

kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="tiny"
memory_percent="off"
package_managers="off"
shell_path="off"
shell_version="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
refresh_rate="off"
gtk_shorthand="on"
de_version="on"

colors=(6 7 6 6 7 7)
bold="on"
underline_enabled="on"
underline_char="─"
separator=" · "

image_backend="ascii"
image_source="${HOME}/.config/neofetch/ascii"
ascii_distro="auto"
ascii_colors=(6 6 7 6)
ascii_bold="on"

gap=4
crop_mode="normal"
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"
stdout="off"
