# SomethingOS telemetry policy
# We do not collect data. If a packaged app still tries, the endpoint
# is rewritten here and sinkholed in /etc/hosts.
SOMETHINGOS_TELEMETRY=off
SOMETHINGOS_TELEMETRY_ENDPOINT=https://nothing.weforgot/v1/sink
SOMETHINGOS_TELEMETRY_SINK=0.0.0.0
SOMETHINGOS_TELEMETRY_MOTTO="We send your data to nothing.weforgot"
