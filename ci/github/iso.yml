# Build a real SomethingOS live ISO.
# live-build is Debian-only — this job runs inside debian:bookworm,
# so a Fedora laptop never has to grow a chroot.
#
# Actions → SomethingOS ISO → Run workflow → pick gnome or plasma.
# Download the artefact from the run page (gh run download).

name: SomethingOS ISO

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Desktop flavour
        type: choice
        options:
          - gnome
          - plasma
        default: gnome
  push:
    tags:
      - "v*"

concurrency:
  group: iso-${{ github.ref }}-${{ github.event.inputs.desktop || 'gnome' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  DESKTOP: ${{ github.event.inputs.desktop || 'gnome' }}
  CI: "true"

jobs:
  iso:
    name: ISO (${{ github.event.inputs.desktop || 'gnome' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache
          docker system prune -af || true
          df -h

      - name: Build inside Debian bookworm
        run: |
          docker run --rm --privileged \
            --name somethingos-lb \
            -e DESKTOP \
            -e CI \
            -e DEBIAN_FRONTEND \
            -e MIRROR=http://deb.debian.org/debian/ \
            -e MIRROR_SECURITY=http://security.debian.org/ \
            -v "$PWD":/build \
            -w /build \
            debian:bookworm \
            bash /build/scripts/ci-debian.sh

      - name: Show result
        if: always()
        run: |
          df -h
          ls -lh somethingos-*.iso* build.log 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somethingos-${{ env.DESKTOP }}-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: somethingos-1.0.0-shadow-${{ env.DESKTOP }}-amd64
          path: |
            somethingos-*.iso
            somethingos-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
